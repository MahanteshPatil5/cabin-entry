            min-height: 100vh;
            display: flex;

        nav {

        }

        .nav-links a:hover {

        }

        .nav-links a.active {

            border-bottom: 2px solid var(--primary-blue);

        /* Main Content */

            padding: 2rem;

            padding: 2.5rem;

        .logout-card:hover {
            transform: translateY(-5px);
        }

        .header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-dark);
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, opacity 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background-color: var(--hover-blue);
        }

        .btn-submit:disabled {
            background-color: #475569;
            cursor: not-allowed;
            opacity: 0.7;
        }

        #messageBox {
            margin-top: 1.5rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .msg-success {
            display: block !important;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .msg-error {
            display: block !important;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            nav {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            .logout-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

    <main>
        <section class="logout-card">

            <div class="header">
                <h1>Exit / Logout from Cabin</h1>
                <p>Check your active entry and check out</p>
            </div>


            <!-- CURRENT ACTIVE ENTRY -->
            <div id="activeEntryInfo" class="active-entry-info">

                <p>Loading active entry...</p>

            </div>


            <!-- MESSAGE -->
            <div id="messageBox"></div>


            <!-- CHECK-OUT BUTTON -->
            <button type="button" id="submitBtn" class="btn-submit" onclick="checkOut()">

                Logout / Check-Out

            </button>

        </section>
    </main>
    <script>
        const messageBox = document.getElementById('messageBox');
        const submitBtn = document.getElementById('submitBtn');

        const API = 'http://localhost:8080/api';

        // ==========================================
        // LOAD CURRENT ACTIVE ENTRY
        // ==========================================

        function loadActiveEntry() {

            const storedEntry = sessionStorage.getItem('activeEntry');

            if (!storedEntry) {
                showMessage(
                    'No active entry found. Please register first.',
                    'error'
                );

                submitBtn.disabled = true;
                submitBtn.textContent = 'No Active Entry';

                return;
            }

            try {

                const entry = JSON.parse(storedEntry);

                console.log("Active Entry:", entry);

                // Show information on page
                displayEntry(entry);

            } catch (error) {

                console.error(
                    'Error reading active entry:',
                    error
                );

                showMessage(
                    'Invalid active entry data.',
                    'error'
                );

                submitBtn.disabled = true;
            }
        }


        // ==========================================
        // DISPLAY CURRENT USER
        // ==========================================

        function displayEntry(entry) {

            const infoBox =
                document.getElementById('activeEntryInfo');

            if (!infoBox) {
                console.error(
                    'activeEntryInfo element not found'
                );
                return;
            }

            const roleLabel =
                entry.role === 'Professor'
                    ? 'Department'
                    : 'USN';

            const entryTime =
                entry.entryTime
                    ? new Date(entry.entryTime).toLocaleString()
                    : 'N/A';

            infoBox.innerHTML = `
            <div class="entry-row">
                <strong>Name:</strong>
                <span>${entry.name || 'N/A'}</span>
            </div>

            <div class="entry-row">
                <strong>Role:</strong>
                <span>${entry.role || 'N/A'}</span>
            </div>

            <div class="entry-row">
                <strong>${roleLabel}:</strong>
                <span>${entry.usnOrDept || 'N/A'}</span>
            </div>

            <div class="entry-row">
                <strong>Cabin:</strong>
                <span>${entry.roomName || 'N/A'}</span>
            </div>

            <div class="entry-row">
                <strong>People:</strong>
                <span>${entry.peopleCount || 1}</span>
            </div>

            <div class="entry-row">
                <strong>Check-in:</strong>
                <span>${entryTime}</span>
            </div>
        `;
        }


        // ==========================================
        // CHECK OUT
        // ==========================================

        async function checkOut() {

            const storedEntry =
                sessionStorage.getItem('activeEntry');

            if (!storedEntry) {

                showMessage(
                    'No active entry found.',
                    'error'
                );

                return;
            }

            let entry;

            try {

                entry = JSON.parse(storedEntry);

            } catch (error) {

                showMessage(
                    'Invalid active entry.',
                    'error'
                );

                return;
            }

            if (!entry.id) {

                showMessage(
                    'Entry ID not found.',
                    'error'
                );

                return;
            }

            const confirmed =
                confirm(
                    'Are you sure you want to check out?'
                );

            if (!confirmed) {
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Checking Out...';

            try {

                const response =
                    await fetch(
                        `${API}/entries/${entry.id}/exit`,
                        {
                            method: 'PUT'
                        }
                    );

                if (!response.ok) {

                    const data =
                        await response.json()
                            .catch(() => ({}));

                    showMessage(
                        data.message ||
                        'Could not complete checkout.',
                        'error'
                    );

                    submitBtn.disabled = false;
                    submitBtn.textContent =
                        'Logout / Check-Out';

                    return;
                }


                // ==================================
                // REMOVE ACTIVE ENTRY FROM BROWSER
                // ==================================

                sessionStorage.removeItem(
                    'activeEntry'
                );


                showMessage(
                    'Logged out successfully!',
                    'success'
                );


                // Go back to rooms after short delay

                setTimeout(() => {

                    window.location.href =
                        'rooms.html';

                }, 1000);


            } catch (error) {

                console.error(
                    'Checkout error:',
                    error
                );

                showMessage(
                    'Connection error. Is the server running?',
                    'error'
                );

                submitBtn.disabled = false;

                submitBtn.textContent =
                    'Logout / Check-Out';
            }
        }


        // ==========================================
        // MESSAGE
        // ==========================================

        function showMessage(text, type) {

            messageBox.textContent = text;

            messageBox.className =
                type === 'success'
                    ? 'msg-success'
                    : 'msg-error';

            messageBox.style.display = 'block';
        }


        // ==========================================
        // PAGE LOAD
        // ==========================================

        loadActiveEntry();

    </script>
</body>
