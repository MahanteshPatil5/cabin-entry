<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Book Room | Cabin Management System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --primary: #1E3A8A;
      --primary-light: #3B82F6;
      --green: #22C55E;
      --green-bg: #F0FDF4;
      --yellow: #F59E0B;
      --yellow-bg: #FFFBEB;
      --red: #EF4444;
      --red-bg: #FEF2F2;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-400: #9CA3AF;
      --gray-600: #4B5563;
      --gray-800: #1F2937;
      --radius: 14px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #F0F4FF;
      min-height: 100vh;
      color: var(--gray-800);
      display: flex;
      flex-direction: column;
    }

    /* NAVIGATION */
    nav {
      background: var(--primary);
      padding: 0 28px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(30,58,138,.3);
      position: sticky; 
      top: 0; 
      z-index: 100;
    }
    .nav-left { display: flex; align-items: center; gap: 16px; }
    .back-btn {
      background: rgba(255,255,255,.15);
      border: none; 
      color: white;
      width: 34px; 
      height: 34px;
      border-radius: 50%; 
      font-size: 18px;
      cursor: pointer; 
      display: flex;
      align-items: center; 
      justify-content: center;
      text-decoration: none;
      transition: background .2s;
    }
    .back-btn:hover { background: rgba(255,255,255,.25); }
    .nav-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: white;
    }
    .nav-right { display: flex; gap: 8px; }
    .nav-btn {
      background: rgba(255,255,255,.12);
      border: none; 
      color: white;
      padding: 7px 16px; 
      border-radius: 8px;
      font-size: 13px; 
      cursor: pointer;
      transition: background .2s; 
      text-decoration: none;
      display: inline-flex; 
      align-items: center; 
      gap: 6px;
    }
    .nav-btn:hover { background: rgba(255,255,255,.22); }

    /* PAGE HEADER */
    .page-header {
      background: linear-gradient(135deg, #1E3A8A, #2563EB);
      padding: 32px 28px 48px;
      color: white;
    }
    .page-header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px; 
      font-weight: 700;
      margin-bottom: 6px;
    }
    .page-header p { color: #BFDBFE; font-size: 15px; }

    /* LAYOUT CONTENT */
    main {
      max-width: 800px;
      width: 100%;
      margin: -24px auto 40px;
      padding: 0 20px;
    }

    /* ROOM OVERVIEW CARD */
    .room-status-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      padding: 20px 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--gray-200);
    }
    .room-status-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: var(--primary-light);
    }
    .rs-top { display: flex; justify-content: space-between; align-items: center; }
    .rs-name { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: var(--gray-800); }
    .rs-type { font-size: 13px; color: var(--gray-600); margin-top: 2px; }

    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      background: var(--yellow-bg); color: #92400E;
    }
    .pill-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }

    /* FORM CARD */
    .form-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,.05);
      padding: 28px;
      border: 1px solid var(--gray-200);
    }
    .form-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px; 
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      display: flex; 
      align-items: center; 
      gap: 10px;
      border-bottom: 2px solid var(--gray-100);
      padding-bottom: 12px;
    }

    /* ROLE SELECTOR */
    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .role-btn {
      background: var(--gray-100);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all .2s;
    }
    .role-btn:hover { background: #E0E7FF; }
    .role-btn.selected {
      background: #EFF6FF;
      border-color: var(--primary-light);
      color: var(--primary);
    }
    .role-btn .role-icon { font-size: 18px; }
    .role-btn .role-lbl { font-weight: 600; font-size: 14px; }

    /* FORM FIELDS */
    .field { margin-bottom: 18px; }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-600);
      margin-bottom: 6px;
    }
    .field label span { color: var(--red); }
    .field input, .field select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--gray-800);
      background: white;
      transition: border-color .2s;
      outline: none;
    }
    .field input:focus, .field select:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .error-msg {
      background: var(--red-bg);
      color: var(--red);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      border: 1px solid #FCA5A5;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .submit-btn:hover { background: #1d4ed8; }

    /* SUCCESS CONFIRMATION CARD */
    .success-card {
      display: none;
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      padding: 36px 28px;
      text-align: center;
      border: 1px solid var(--gray-200);
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .success-icon { font-size: 48px; margin-bottom: 12px; }
    .success-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--gray-800);
    }
    .success-sub { font-size: 15px; color: var(--gray-600); margin-top: 4px; margin-bottom: 24px; }
    
    .entry-info {
      background: var(--gray-100);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      text-align: left;
    }
    .entry-info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--gray-200);
      font-size: 13.5px;
    }
    .entry-info-row:last-child { border-bottom: none; }
    .entry-info-row .key { color: var(--gray-600); }
    .entry-info-row .val { font-weight: 600; color: var(--gray-800); text-align: right; }

    .action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .action-btn:hover { background: #1d4ed8; }

    @media (max-width: 600px) {
      .field-row { grid-template-columns: 1fr; }
      nav { padding: 0 16px; }
      .page-header { padding: 24px 16px 40px; }
      main { padding: 0 14px; }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <div class="nav-left">
      <a href="rooms.html" class="back-btn" title="Back to Rooms">←</a>
      <div class="nav-title" id="nav-room-name">Pre-Book Room</div>
    </div>
    <div class="nav-right">
      <a href="rooms.html" class="nav-btn">View All Rooms</a>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <h1>Advance Room Reservation</h1>
    <p>Schedule and secure spaces ahead of time for meetings, seminars, and study sessions.</p>
  </header>

  <!-- Main Content Container -->
  <main>
    <!-- Room Status Banner -->
    <div class="room-status-card">
      <div class="rs-top">
        <div>
          <div class="rs-name" id="room-name">Loading...</div>
          <div class="rs-type" id="room-type">–</div>
        </div>
        <div class="status-pill">
          <div class="pill-dot"></div><span>Advance Booking</span>
        </div>
      </div>
    </div>

    <!-- Booking Input Form -->
    <div class="form-card" id="form-card">
      <div class="form-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        Schedule Reservation
      </div>

      <!-- Role Selector -->
      <div class="role-selector">
        <div class="role-btn selected" id="btn-student" onclick="selectRole('Student')">
          <span class="role-icon">🎓</span>
          <div class="role-lbl">Student</div>
        </div>
        <div class="role-btn" id="btn-professor" onclick="selectRole('Professor')">
          <span class="role-icon">👨‍🏫</span>
          <div class="role-lbl">Professor</div>
        </div>
      </div>

      <!-- Form Inputs -->
      <div class="field">
        <label for="f-name">Full Name <span>*</span></label>
        <input type="text" id="f-name" placeholder="Enter your full name" />
      </div>

      <div class="field">
        <label id="usn-label" for="f-usn">USN <span>*</span></label>
        <input type="text" id="f-usn" placeholder="e.g., 1XX21CS001" />
      </div>

      <div class="field">
        <label for="f-date">Reservation Date <span>*</span></label>
        <input type="date" id="f-date" />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-start-time">Start Time <span>*</span></label>
          <input type="time" id="f-start-time" />
        </div>
        <div class="field">
          <label for="f-end-time">End Time <span>*</span></label>
          <input type="time" id="f-end-time" />
        </div>
      </div>

      <div class="field">
        <label for="f-count">Number of Expected Attendees <span>*</span></label>
        <input type="number" id="f-count" min="1" value="1" />
      </div>

      <div class="field">
        <label for="f-team">Team Members / Co-hosts</label>
        <input type="text" id="f-team" placeholder="Names separated by commas (optional)" />
      </div>

      <div class="field">
        <label for="f-purpose">Purpose of Reservation <span>*</span></label>
        <select id="f-purpose">
          <option value="">Select purpose</option>
          <option>Project Work</option>
          <option>Seminar</option>
          <option>Meeting</option>
          <option>Study Group</option>
          <option>Presentation Practice</option>
          <option>Faculty Discussion</option>
          <option>Event</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field" id="other-field" style="display:none">
        <label for="f-other">Specify Purpose</label>
        <input type="text" id="f-other" placeholder="Describe your purpose" />
      </div>

      <div class="error-msg" id="error-msg"></div>
      <button class="submit-btn" id="submit-btn" onclick="submitPreBook()">📅 Confirm Pre-Booking</button>
    </div>

    <!-- Confirmation Screen -->
    <div class="success-card" id="success-card">
      <div class="success-icon">🎉</div>
      <div class="success-title">Room Reserved!</div>
      <div class="success-sub" id="success-sub">–</div>
      <div class="entry-info" id="entry-info"></div>
      <button class="action-btn" onclick="window.location.href='rooms.html'">Return to Rooms</button>
    </div>
  </main>

  <script>
    const ROOM_ID = parseInt(new URLSearchParams(window.location.search).get('room_id') || '1');
    let selectedRole = 'Student';

    const ROOMS_STATIC = {
      1: { name: 'Cabin 1', type: 'Small Cabin', capacity: 6 },
      2: { name: 'Cabin 2', type: 'Small Cabin', capacity: 6 },
      3: { name: 'Cabin 3', type: 'Small Cabin', capacity: 6 },
      4: { name: 'Cabin 4', type: 'Small Cabin', capacity: 6 },
      5: { name: 'Project Room A', type: 'Project Room', capacity: 12 },
      6: { name: 'Project Room B', type: 'Project Room', capacity: 12 },
      7: { name: 'Top Floor Open Space', type: 'Open Space', capacity: 40 },
      8: { name: 'Main Hall', type: 'Ground Floor Hall', capacity: 80 },
      9: { name: 'Seminar Room', type: 'Seminar', capacity: 30 },
      10: { name: 'Discussion Room', type: 'Meeting', capacity: 10 }
    };

    function loadRoomDetails() {
      const room = ROOMS_STATIC[ROOM_ID] || { name: 'Unknown Room', type: 'General Space', capacity: 0 };
      document.getElementById('nav-room-name').textContent = `Pre-Book ${room.name}`;
      document.getElementById('room-name').textContent = room.name;
      document.getElementById('room-type').textContent = `${room.type} · Capacity: ${room.capacity} seats`;

      // Set default minimum date to today
      const today = new Date().toISOString().split('T')[0];
      const dateInp = document.getElementById('f-date');
      dateInp.min = today;
      dateInp.value = today;
    }

    function selectRole(role) {
      selectedRole = role;
      document.getElementById('btn-student').classList.toggle('selected', role === 'Student');
      document.getElementById('btn-professor').classList.toggle('selected', role === 'Professor');
      const lbl = document.getElementById('usn-label');
      const inp = document.getElementById('f-usn');
      if (role === 'Professor') {
        lbl.innerHTML = 'Department <span>*</span>';
        inp.placeholder = 'e.g., Computer Science';
      } else {
        lbl.innerHTML = 'USN <span>*</span>';
        inp.placeholder = 'e.g., 1XX21CS001';
      }
    }

    document.getElementById('f-purpose').addEventListener('change', function () {
      document.getElementById('other-field').style.display = this.value === 'Other' ? 'block' : 'none';
    });

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 4000);
    }

    function submitPreBook() {
      const name = document.getElementById('f-name').value.trim();
      const usn = document.getElementById('f-usn').value.trim();
      const date = document.getElementById('f-date').value;
      const startTime = document.getElementById('f-start-time').value;
      const endTime = document.getElementById('f-end-time').value;
      const count = parseInt(document.getElementById('f-count').value) || 1;
      const team = document.getElementById('f-team').value.trim();
      let purpose = document.getElementById('f-purpose').value;

      if (purpose === 'Other') purpose = document.getElementById('f-other').value.trim() || 'Other';

      if (!name) return showError('Please enter your name.');
      if (!usn) return showError(selectedRole === 'Professor' ? 'Please enter department.' : 'Please enter USN.');
      if (!date) return showError('Please select a date.');
      if (!startTime || !endTime) return showError('Please select start and end times.');
      if (startTime >= endTime) return showError('End time must be after start time.');
      if (!purpose) return showError('Please select a purpose.');

      const bookingData = {
        bookingId: 'PB' + Math.floor(100000 + Math.random() * 900000),
        roomName: ROOMS_STATIC[ROOM_ID]?.name || 'Room',
        userName: name,
        role: selectedRole,
        usnOrDept: usn,
        date,
        startTime,
        endTime,
        peopleCount: count,
        team,
        purpose
      };

      showSuccess(bookingData);
    }

    function showSuccess(data) {
      document.getElementById('form-card').style.display = 'none';
      document.getElementById('success-card').style.display = 'block';
      document.getElementById('success-sub').innerHTML = `Reserved <strong>${data.roomName}</strong>`;
      document.getElementById('entry-info').innerHTML = `
        <div class="entry-info-row"><span class="key">Booking Ref</span><span class="val">${data.bookingId}</span></div>
        <div class="entry-info-row"><span class="key">Reserved For</span><span class="val">${data.userName}</span></div>
        <div class="entry-info-row"><span class="key">Role</span><span class="val">${data.role}</span></div>
        <div class="entry-info-row"><span class="key">${data.role === 'Professor' ? 'Department' : 'USN'}</span><span class="val">${data.usnOrDept}</span></div>
        <div class="entry-info-row"><span class="key">Date</span><span class="val">${data.date}</span></div>
        <div class="entry-info-row"><span class="key">Time Slot</span><span class="val">${data.startTime} - ${data.endTime}</span></div>
        <div class="entry-info-row"><span class="key">Attendees</span><span class="val">${data.peopleCount}</span></div>
        <div class="entry-info-row"><span class="key">Purpose</span><span class="val">${data.purpose}</span></div>
      `;
    }

    loadRoomDetails();
  </script>
</body>
</html>
