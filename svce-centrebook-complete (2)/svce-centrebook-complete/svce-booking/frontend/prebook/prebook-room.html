<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pre-Book Room – CentreBook</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #1E3A8A;
      --primary-light: #3B82F6;
      --green: #22C55E;
      --green-bg: #F0FDF4;
      --yellow: #F59E0B;
      --yellow-bg: #FFFBEB;
      --red: #EF4444;
      --red-bg: #FEF2F2;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-400: #9CA3AF;
      --gray-600: #4B5563;
      --gray-800: #1F2937;
      --radius: 14px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #F0F4FF;
      min-height: 100vh;
      color: var(--gray-800);
    }

    nav {
      background: var(--primary);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(30, 58, 138, .25);
    }

    .back-btn {
      background: rgba(255, 255, 255, .15);
      border: none;
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .nav-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 600;
      color: white;
      flex: 1;
    }

    .page-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .room-status-card {
      background: white;
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
      border-left: 5px solid var(--primary-light);
    }

    .rs-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .rs-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
    }

    .rs-type {
      font-size: 13px;
      color: var(--gray-400);
      margin-top: 3px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      background: #EFF6FF;
      color: var(--primary);
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-light);
    }

    .form-card {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
    }

    .form-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .role-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--gray-200);
      background: white;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all .2s;
    }

    .role-btn .role-icon {
      font-size: 22px;
      display: block;
      margin-bottom: 4px;
    }

    .role-btn .role-lbl {
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-600);
    }

    .role-btn.selected {
      border-color: var(--primary-light);
      background: #EFF6FF;
    }

    .role-btn.selected .role-lbl {
      color: var(--primary);
    }

    .field {
      margin-bottom: 16px;
    }

    .field-row {
      display: flex;
      gap: 12px;
    }

    .field-row .field {
      flex: 1;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-600);
      margin-bottom: 6px;
    }

    label span {
      color: #EF4444;
    }

    input,
    select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--gray-800);
      background: white;
      transition: border-color .2s;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .1);
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all .2s;
    }

    .submit-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .error-msg {
      background: var(--red-bg);
      color: #B91C1C;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .success-card {
      display: none;
      background: white;
      border-radius: var(--radius);
      padding: 32px 24px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
      text-align: center;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      background: var(--green-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }

    .success-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .success-sub {
      font-size: 14px;
      color: var(--gray-600);
      margin-bottom: 16px;
    }

    .entry-info {
      background: var(--gray-50);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
      text-align: left;
    }

    .entry-info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 5px 0;
      border-bottom: 1px solid var(--gray-100);
    }

    .entry-info-row:last-child {
      border-bottom: none;
    }

    .entry-info-row .key {
      color: var(--gray-400);
    }

    .entry-info-row .val {
      font-weight: 500;
    }

    .action-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }

    .action-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <nav>
    <a href="prebook.html" class="back-btn">←</a>
    <div class="nav-title" id="nav-room-name">Pre-Book Room</div>
  </nav>

  <div class="page-wrap">
    <!-- Selected Room Overview -->
    <div class="room-status-card">
      <div class="rs-top">
        <div>
          <div class="rs-name" id="room-name">Loading...</div>
          <div class="rs-type" id="room-type">–</div>
        </div>
        <div class="status-pill">
          <div class="pill-dot"></div><span>Advance Booking</span>
        </div>
      </div>
    </div>

    <!-- Booking Form -->
    <div class="form-card" id="form-card">
      <div class="form-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E3A8A" stroke-width="2.5">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        Schedule Reservation
      </div>

      <div class="role-selector">
        <div class="role-btn selected" id="btn-student" onclick="selectRole('Student')">
          <span class="role-icon">🎓</span>
          <div class="role-lbl">Student</div>
        </div>
        <div class="role-btn" id="btn-professor" onclick="selectRole('Professor')">
          <span class="role-icon">👨‍🏫</span>
          <div class="role-lbl">Professor</div>
        </div>
      </div>

      <div class="field">
        <label>Full Name <span>*</span></label>
        <input type="text" id="f-name" placeholder="Enter your full name" />
      </div>

      <div class="field">
        <label id="usn-label">USN <span>*</span></label>
        <input type="text" id="f-usn" placeholder="e.g., 1XX21CS001" />
      </div>

      <div class="reservation-summary">

        <div class="summary-item">
          <span class="summary-label">Date</span>
          <strong id="reservation-date">--</strong>
        </div>

        <div class="summary-item">
          <span class="summary-label">Time</span>
          <strong id="reservation-time">--</strong>
        </div>

      </div>

      <div class="field">
        <label>Number of Expected Attendees <span>*</span></label>
        <input type="number" id="f-count" min="1" value="1" />
      </div>

      <div class="field">
        <label>Team Members / Co-hosts</label>
        <input type="text" id="f-team" placeholder="Names separated by commas (optional)" />
      </div>

      <div class="field">
        <label>Purpose of Reservation <span>*</span></label>
        <select id="f-purpose">
          <option value="">Select purpose</option>
          <option>Project Work</option>
          <option>Seminar</option>
          <option>Meeting</option>
          <option>Study Group</option>
          <option>Presentation Practice</option>
          <option>Faculty Discussion</option>
          <option>Event</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field" id="other-field" style="display:none">
        <label>Specify Purpose</label>
        <input type="text" id="f-other" placeholder="Describe your purpose" />
      </div>

      <div class="error-msg" id="error-msg"></div>
      <button class="submit-btn" id="submit-btn" onclick="submitPreBook()">📅 Confirm Pre-Booking</button>
    </div>

    <!-- Confirmation Screen -->
    <div class="success-card" id="success-card">
      <div class="success-icon">🎉</div>
      <div class="success-title">Room Reserved!</div>
      <div class="success-sub" id="success-sub">–</div>
      <div class="entry-info" id="entry-info"></div>
      <button class="action-btn" onclick="window.location.href='rooms.html'">Return to Rooms</button>
    </div>
  </div>

  <script>

    const API_BASE_URL = "http://localhost:8080/api";


    // ==========================================
    // GET DATA FROM URL
    // ==========================================

    const params = new URLSearchParams(window.location.search);

    const ROOM_ID = parseInt(params.get("room_id"));

    const BOOKING_DATE = params.get("date");

    const START_TIME = params.get("startTime");

    const END_TIME = params.get("endTime");

    let selectedRole = "Student";

    let selectedRoom = null;


    // ==========================================
    // PAGE LOAD
    // ==========================================

    document.addEventListener("DOMContentLoaded", () => {

      console.log("ROOM_ID:", ROOM_ID);
      console.log("DATE:", BOOKING_DATE);
      console.log("START:", START_TIME);
      console.log("END:", END_TIME);

      loadRoomDetails();

      loadReservationDetails();

      setupEventListeners();

    });


    // ==========================================
    // LOAD ROOM FROM BACKEND
    // ==========================================

    async function loadRoomDetails() {

      if (!ROOM_ID) {

        document.getElementById("nav-room-name").textContent =
          "Invalid Room";

        document.getElementById("room-name").textContent =
          "Invalid Room";

        document.getElementById("room-type").textContent =
          "Room information unavailable";

        return;
      }

      try {

        const response = await fetch(
          `${API_BASE_URL}/rooms/${ROOM_ID}`
        );

        if (!response.ok) {

          throw new Error(
            "Could not load room information."
          );
        }

        const room = await response.json();

        selectedRoom = room;

        console.log("Selected room:", room);


        document.getElementById("nav-room-name").textContent =
          `Pre-Book ${room.name}`;


        document.getElementById("room-name").textContent =
          room.name;


        document.getElementById("room-type").textContent =
          `${room.type} · Capacity: ${room.capacity} seats`;


      } catch (error) {

        console.error(
          "Room loading error:",
          error
        );

        document.getElementById("nav-room-name").textContent =
          "Pre-Book Room";

        document.getElementById("room-name").textContent =
          "Room information unavailable";

        document.getElementById("room-type").textContent =
          "Could not load room details.";

        showError(
          "Could not load room information."
        );
      }
    }


    // ==========================================
    // LOAD DATE AND TIME
    // ==========================================

    function loadReservationDetails() {

      const dateElement =
        document.getElementById("reservation-date");

      const timeElement =
        document.getElementById("reservation-time");


      console.log(
        "Reservation:",
        BOOKING_DATE,
        START_TIME,
        END_TIME
      );


      if (
        !ROOM_ID ||
        !BOOKING_DATE ||
        !START_TIME ||
        !END_TIME
      ) {

        dateElement.textContent =
          "Not selected";

        timeElement.textContent =
          "Not selected";

        showError(
          "Reservation date or time is missing. Please select the room again."
        );

        return;
      }


      dateElement.textContent =
        formatDate(BOOKING_DATE);


      timeElement.textContent =
        `${formatTime(START_TIME)} - ${formatTime(END_TIME)}`;
    }


    // ==========================================
    // ROLE SELECTION
    // ==========================================

    function selectRole(role) {

      selectedRole = role;


      document
        .getElementById("btn-student")
        .classList.toggle(
          "selected",
          role === "Student"
        );


      document
        .getElementById("btn-professor")
        .classList.toggle(
          "selected",
          role === "Professor"
        );


      const label =
        document.getElementById("usn-label");

      const input =
        document.getElementById("f-usn");


      if (role === "Professor") {

        label.innerHTML =
          'Department <span>*</span>';

        input.placeholder =
          "e.g., Computer Science & Engineering";

      } else {

        label.innerHTML =
          'USN <span>*</span>';

        input.placeholder =
          "e.g., 1XX21CS001";
      }
    }


    // ==========================================
    // OTHER PURPOSE
    // ==========================================

    function setupEventListeners() {

      const purposeSelect =
        document.getElementById("f-purpose");

      const otherField =
        document.getElementById("other-field");


      if (!purposeSelect) return;


      purposeSelect.addEventListener(
        "change",
        function () {

          if (this.value === "Other") {

            otherField.style.display =
              "block";

          } else {

            otherField.style.display =
              "none";
          }

        }
      );
    }


    // ==========================================
    // SUBMIT PRE-BOOKING
    // ==========================================

    async function submitPreBook() {

      clearError();


      // Make sure room is loaded
      if (!selectedRoom) {

        showError(
          "Room information is still loading. Please try again."
        );

        return;
      }


      // ======================================
      // READ FORM DATA
      // ======================================

      const name =
        document
          .getElementById("f-name")
          .value
          .trim();


      const usnOrDept =
        document
          .getElementById("f-usn")
          .value
          .trim();


      const peopleCount =
        parseInt(
          document
            .getElementById("f-count")
            .value,
          10
        );


      const teamMembers =
        document
          .getElementById("f-team")
          .value
          .trim();


      let purpose =
        document
          .getElementById("f-purpose")
          .value;


      const otherPurpose =
        document
          .getElementById("f-other")
          .value
          .trim();


      // ======================================
      // VALIDATION
      // ======================================

      if (!name) {

        showError(
          "Please enter your full name."
        );

        return;
      }


      if (!usnOrDept) {

        showError(
          selectedRole === "Professor"
            ? "Please enter your department."
            : "Please enter your USN."
        );

        return;
      }


      if (!BOOKING_DATE) {

        showError(
          "Reservation date is missing."
        );

        return;
      }


      if (!START_TIME || !END_TIME) {

        showError(
          "Reservation time is missing."
        );

        return;
      }


      if (START_TIME >= END_TIME) {

        showError(
          "End time must be after start time."
        );

        return;
      }


      if (
        isNaN(peopleCount) ||
        peopleCount <= 0
      ) {

        showError(
          "Number of attendees must be at least 1."
        );

        return;
      }


      if (
        peopleCount >
        selectedRoom.capacity
      ) {

        showError(
          `This room can accommodate only ${selectedRoom.capacity} people.`
        );

        return;
      }


      if (!purpose) {

        showError(
          "Please select a purpose."
        );

        return;
      }


      if (purpose === "Other") {

        if (!otherPurpose) {

          showError(
            "Please specify your purpose."
          );

          return;
        }

        purpose = otherPurpose;
      }


      // ======================================
      // CREATE REQUEST
      // ======================================

      const payload = {

        roomId: ROOM_ID,

        userName: name,

        role: selectedRole,

        usnOrDept: usnOrDept,

        teamMembers: teamMembers,

        purpose: purpose,

        peopleCount: peopleCount,

        bookingDate: BOOKING_DATE,

        startTime: START_TIME,

        endTime: END_TIME
      };


      console.log(
        "Sending reservation:",
        payload
      );


      // ======================================
      // BUTTON LOADING
      // ======================================

      const button =
        document.getElementById("submit-btn");

      button.disabled = true;

      button.textContent =
        "Processing Reservation...";


      try {

        const response =
          await fetch(
            `${API_BASE_URL}/prebook`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(payload)
            }
          );


        const result =
          await response
            .json()
            .catch(() => ({}));


        if (!response.ok) {

          throw new Error(
            result.message ||
            "Could not complete reservation."
          );
        }


        console.log(
          "Reservation created:",
          result
        );


        showSuccess(
          result,
          payload
        );


      } catch (error) {

        console.error(
          "Pre-booking error:",
          error
        );


        showError(
          error.message ||
          "Could not connect to the server."
        );


        button.disabled = false;

        button.textContent =
          "📅 Confirm Pre-Booking";
      }
    }


    // ==========================================
    // SUCCESS SCREEN
    // ==========================================

    function showSuccess(result, payload) {

      document
        .getElementById("form-card")
        .style.display = "none";


      document
        .getElementById("success-card")
        .style.display = "block";


      document
        .getElementById("success-sub")
        .innerHTML =
        `Reserved <strong>${escapeHtml(
          selectedRoom.name
        )}</strong>`;


      document
        .getElementById("entry-info")
        .innerHTML = `

            <div class="entry-info-row">
                <span class="key">
                    Reservation ID
                </span>

                <span class="val">
                    ${escapeHtml(
          String(
            result.id ||
            result.bookingId ||
            "--"
          )
        )}
                </span>
            </div>


            <div class="entry-info-row">
                <span class="key">
                    Reserved For
                </span>

                <span class="val">
                    ${escapeHtml(
          payload.userName
        )}
                </span>
            </div>


            <div class="entry-info-row">
                <span class="key">
                    Role
                </span>

                <span class="val">
                    ${escapeHtml(
          payload.role
        )}
                </span>
            </div>


            <div class="entry-info-row">
                <span class="key">
                    ${payload.role === "Professor"
          ? "Department"
          : "USN"
        }
                </span>

                <span class="val">
                    ${escapeHtml(
          payload.usnOrDept
        )}
                </span>
            </div>


            <div class="entry-info-row">
                <span class="key">
                    Date
                </span>

                <span class="val">
                    ${escapeHtml(
          formatDate(
            payload.bookingDate
          )
        )}
                </span>
            </div>


            <div class="entry-info-row">
                <span class="key">
                    Time
                </span>

                <span class="val">
                    ${escapeHtml(
          `${formatTime(payload.startTime)}
                        - ${formatTime(payload.endTime)}`
        )}
                </span>
            </div>


            <div class="entry-info-row">
                <span class="key">
                    Attendees
                </span>

                <span class="val">
                    ${payload.peopleCount}
                </span>
            </div>


            <div class="entry-info-row">
                <span class="key">
                    Purpose
                </span>

                <span class="val">
                    ${escapeHtml(
          payload.purpose
        )}
                </span>
            </div>
        `;
    }


    // ==========================================
    // ERROR
    // ==========================================

    function showError(message) {

      const errorElement =
        document.getElementById(
          "error-msg"
        );


      errorElement.textContent =
        message;


      errorElement.style.display =
        "block";
    }


    // ==========================================
    // CLEAR ERROR
    // ==========================================

    function clearError() {

      const errorElement =
        document.getElementById(
          "error-msg"
        );


      errorElement.textContent =
        "";


      errorElement.style.display =
        "none";
    }


    // ==========================================
    // DATE FORMAT
    // ==========================================

    function formatDate(dateString) {

      if (!dateString) {
        return "--";
      }


      const date =
        new Date(
          `${dateString}T00:00:00`
        );


      return date.toLocaleDateString(
        "en-IN",
        {
          day: "2-digit",
          month: "short",
          year: "numeric"
        }
      );
    }


    // ==========================================
    // TIME FORMAT
    // ==========================================

    function formatTime(timeString) {

      if (!timeString) {
        return "--";
      }


      const [hours, minutes] =
        timeString.split(":");


      const date = new Date();

      date.setHours(
        parseInt(hours),
        parseInt(minutes),
        0,
        0
      );


      return date.toLocaleTimeString(
        "en-IN",
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );
    }


    // ==========================================
    // HTML ESCAPING
    // ==========================================

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }


      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

  </script>
