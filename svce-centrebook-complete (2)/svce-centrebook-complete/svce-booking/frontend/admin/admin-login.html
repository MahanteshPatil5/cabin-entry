<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SVCE CentreBook</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="card login-card">
            <div class="login-header">
                <h2>SVCE CentreBook</h2>
                <p>Admin Portal Authentication</p>
            </div>

            <div id="adminLoginMessage" class="alert hidden"></div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminId">Admin ID</label>
                    <input type="text" id="adminId" name="adminId" class="form-control" placeholder="Enter Admin ID" required autofocus>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" name="adminPassword" class="form-control" placeholder="Enter Password" required>
                </div>

                <button type="submit" id="adminLclearoginBtn" class="btn btn-primary btn-block">Login to Control Panel</button>
            </form>
        </div>
    </div>
    <script src="js/admin-login.js"></script>
</body>
</html>
