<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage History - SVCE CentreBook Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<nav class="admin-navbar" id="adminNavbar">
    <div class="nav-brand">
        <span class="brand-title">SVCE CentreBook</span>
        <span class="badge">Admin Portal</span>
    </div>

    <ul class="nav-links">
        <li>
            <a href="admin-dashboard.html" class="nav-link">Home</a>
        </li>

        <li>
            <a href="admin-cabin-management.html" class="nav-link">
                Cabin Management
            </a>
        </li>

        <li>
            <a href="admin-history.html" class="nav-link active">
                History
            </a>
        </li>

        <li>
            <button id="adminLogoutBtn" class="btn btn-danger btn-sm">
                Logout
            </button>
        </li>
    </ul>
</nav>


<main class="main-content">

    <div class="page-header">
        <h1>Usage History</h1>
        <p>View previous cabin entry and exit records.</p>
    </div>


    <!-- FILTER CARD -->
    <div class="card filter-card">

        <div class="filter-grid">

            <div>
                <label for="historySearch">
                    Search Name / USN
                </label>

                <input
                    type="text"
                    id="historySearch"
                    class="form-control"
                    placeholder="Search..."
                >
            </div>


            <div>
                <label for="historyCabinFilter">
                    Cabin
                </label>

                <select
                    id="historyCabinFilter"
                    class="form-control"
                >
                    <option value="">All Cabins</option>
                </select>
            </div>


            <div>
                <label for="historyRoleFilter">
                    Role
                </label>

                <select
                    id="historyRoleFilter"
                    class="form-control"
                >
                    <option value="">All Roles</option>
                    <option value="STUDENT">STUDENT</option>
                    <option value="PROFESSOR">PROFESSOR</option>
                </select>
            </div>


            <div>
                <label for="historyDateFrom">
                    Date From
                </label>

                <input
                    type="date"
                    id="historyDateFrom"
                    class="form-control"
                >
            </div>


            <div>
                <label for="historyDateTo">
                    Date To
                </label>

                <input
                    type="date"
                    id="historyDateTo"
                    class="form-control"
                >
            </div>


            <div class="filter-actions">

                <button
                    id="historyFilterBtn"
                    class="btn btn-primary"
                >
                    Filter
                </button>

                <button
                    id="historyResetBtn"
                    class="btn btn-secondary"
                >
                    Reset
                </button>

            </div>

        </div>

    </div>


    <div id="historyMessage" class="alert hidden"></div>


    <!-- HISTORY TABLE -->
    <div class="card">

        <div class="table-responsive">

            <table class="data-table" id="historyTable">

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Role</th>
                        <th>USN</th>
                        <th>People Count</th>
                        <th>Cabin</th>
                        <th>Time</th>
                    </tr>
                </thead>


                <tbody id="historyTableBody">

                    <tr>
                        <td colspan="6" class="text-center">
                            Loading history records...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>


<script src="js/admin-history.js"></script>

</body>
</html>
